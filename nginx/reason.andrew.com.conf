# =============================================================================
# Nginx Upstream Configuration for Reason (reason.andrew.com)
# =============================================================================
# Upstream to Granian ASGI server listening locally on 127.0.0.1:8008
#
# Covers:
# 1. Port 80   (HTTP)  -> Redirects 301 to https://reason.andrew.com/
# 2. Port 8000 (HTTP/S)-> Redirects 301 to https://reason.andrew.com/
# 3. Port 443  (HTTPS) -> Proxies to Granian with WebSocket & streaming support
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream granian_backend {
    server 127.0.0.1:8008;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# 1. Port 80 (HTTP) -> Redirect all traffic to HTTPS port 443
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name reason.andrew.com localhost 127.0.0.1;

    location / {
        return 301 https://reason.andrew.com$request_uri;
    }
}

# -----------------------------------------------------------------------------
# 2. Port 8000 (HTTP or HTTPS) -> Catch and redirect to standard HTTPS port 443
# -----------------------------------------------------------------------------
server {
    listen 8000 ssl;
    listen [::]:8000 ssl;
    server_name reason.andrew.com localhost 127.0.0.1;

    ssl_certificate /home/crank/coding/antigrav/verbal/nginx/ssl/reason.andrew.com.crt;
    ssl_certificate_key /home/crank/coding/antigrav/verbal/nginx/ssl/reason.andrew.com.key;

    # Intercept plain HTTP sent to this SSL port (Nginx error 497)
    error_page 497 =301 https://reason.andrew.com$request_uri;

    location / {
        return 301 https://reason.andrew.com$request_uri;
    }
}

# -----------------------------------------------------------------------------
# 3. Port 443 (HTTPS) -> Primary SSL Gateway & Granian Reverse Proxy
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name reason.andrew.com localhost 127.0.0.1;

    # SSL Configuration (Self-signed certificate for local / dev server)
    ssl_certificate /home/crank/coding/antigrav/verbal/nginx/ssl/reason.andrew.com.crt;
    ssl_certificate_key /home/crank/coding/antigrav/verbal/nginx/ssl/reason.andrew.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow large literature uploads (PDFs, multi-chunk datasets)
    client_max_body_size 100M;

    # Static Assets (collected via `python manage.py collectstatic`)
    location /static/ {
        alias /home/crank/coding/antigrav/verbal/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Uploaded Media
    location /media/ {
        alias /home/crank/coding/antigrav/verbal/media/;
        expires 7d;
        access_log off;
    }

    # Granian ASGI Application Proxy
    location / {
        proxy_pass http://granian_backend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # WebSocket & Datastar streaming signals support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Generous timeouts for multi-step blueprint execution & local LLM generation
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable proxy buffering so live LLM token streams reach the browser instantly
        proxy_buffering off;
    }
}

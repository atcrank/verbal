{% if not children %}
    <div style="font-size: 0.75rem; color: var(--text-muted); font-style: italic;">No sub-concepts.</div>
{% else %}
    {% for node in children %}
        <div class="search-card" style="border-left: 3px solid var(--primary); margin-bottom: 8px; padding: 10px; margin-top: 5px;" draggable="true" ondragstart="event.dataTransfer.setData('application/json', JSON.stringify({model: 'ConceptNode', id: '{{ node.slug }}', content: '{{ node.narrative_content|escapejs }}', preview: '{{ node.title|escapejs }}'}))">
            <details hx-get="{% url 'demo_ui:grips_concept_children' node.id %}" hx-trigger="toggle once" hx-target="#children-{{ node.id }}" hx-swap="innerHTML">
                <summary class="search-card-title" style="font-size: 0.85rem; color: var(--text-main); cursor: pointer; outline: none;">
                    ↳ {{ node.title }}
                    {% if not node.narrative_content %}
                        <button hx-post="{% url 'demo_ui:fill_grips_stub' node.id %}" hx-swap="outerHTML" style="margin-left: 10px; font-size: 0.7rem; padding: 2px 6px; cursor: pointer; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; color: var(--text-main);">Fill Stub</button>
                    {% endif %}
                </summary>
                <div style="margin-top: 5px; font-size: 0.8rem; color: var(--text-muted); padding-bottom: 8px;">
                    {{ node.narrative_content|truncatechars:150 }}
                </div>
                <div id="children-{{ node.id }}" style="margin-left: 10px; border-left: 1px solid var(--border); padding-left: 10px;">
                    <div style="font-size: 0.75rem; color: var(--text-muted);">Loading sub-concepts...</div>
                </div>
            </details>
        </div>
    {% endfor %}
{% endif %}

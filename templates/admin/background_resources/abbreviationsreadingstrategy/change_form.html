{% extends "admin/change_form.html" %}

{% block after_field_sets %}
    <!-- Prompt Assistant UI -->
    <div class="module aligned" style="border: 1px solid #ccc; background: #f9f9f9; padding: 15px; margin-bottom: 20px;">
        <h2>🤖 Abbreviation Assistant</h2>

        <div style="display: flex; gap: 20px;">
            <div style="flex: 1;">
                <h3>Test Extraction</h3>
                <p class="help">Test the abbreviation extraction against the first chunk of the document, or select a specific chunk from the list below.</p>
                <button type="button" id="btn-preview" class="button" style="background: #417690; color: white;">🔍 Test on Document</button>
                <div id="preview-results" style="margin-top: 10px; background: white; padding: 10px; border: 1px solid #ddd; min-height: 80px; font-family: monospace; font-size: 12px;">
                    Results will appear here...
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const $ = django.jQuery;

            $('#btn-preview').on('click', function() {
                const docId = $('#id_document').val();
                // Check if a chunk is selected in the inline
                const selectedChunkId = $('input[name="selected_test_chunk"]:checked').val();

                if (!docId && !selectedChunkId) {
                    alert("Please select a document (or specific chunk).");
                    return;
                }

                $('#preview-results').html("<em>Scanning for abbreviations...</em>");

                $.ajax({
                    url: '/api/llm/admin/preview_abbreviations/',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        document_id: docId ? parseInt(docId) : null,
                        chunk_id: selectedChunkId || null
                    }),
                    headers: {'X-CSRFToken': '{{ csrf_token }}'},
                    success: function(data) {
                        if (data.error) {
                            $('#preview-results').html(`<span style="color:red">${data.error}</span>`);
                        } else {
                            let html = `<strong>Found ${data.count} abbreviations.</strong><br/><ul>`;
                            data.abbreviations.forEach(item => {
                                html += `<li>${item}</li>`;
                            });
                            html += "</ul>";

                            // Show/Hide Source Text
                            html += `<details style="margin-top:10px; cursor:pointer; border-top:1px solid #eee; padding-top:5px;"><summary style="color:#417690; font-weight:bold;">Show/Hide Source Text</summary><pre style="white-space: pre-wrap; color:#666; margin-top:5px;">${data.sample_text}</pre></details>`;

                            $('#preview-results').html(html);
                        }
                    },
                    error: function(err) {
                        $('#preview-results').html("Error fetching preview.");
                        console.error(err);
                    }
                });
            });
        });
    </script>
{% endblock %}

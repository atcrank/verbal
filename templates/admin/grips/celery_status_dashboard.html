{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main" style="padding: 30px; text-align: center;">
    <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 40px; max-width: 600px; margin: 0 auto;">
        <h2 style="color: #4338ca; margin-bottom: 15px;">⚡ Django Tasks Monitoring Dashboard</h2>
        <p style="color: #64748b; font-size: 1rem; margin-bottom: 25px;">
            The legacy Celery dashboard has been migrated to the native PostgreSQL-backed Django Tasks monitoring system.
        </p>
        <a href="{% url 'admin:verbal_tasks_dashboard' %}" style="display: inline-block; background: #4338ca; color: #ffffff; padding: 12px 24px; border-radius: 6px; font-weight: bold; text-decoration: none;">
            Open Task Queue Dashboard →
        </a>
    </div>
</div>
<script>
    window.location.href = "{% url 'admin:verbal_tasks_dashboard' %}";
</script>
{% endblock %}

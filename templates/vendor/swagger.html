{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>API Docs</title>
  <meta charset="utf-8"/>
  <link type="text/css" rel="stylesheet" href="{% static 'vendor/swagger-ui.css' %}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="{% static 'vendor/swagger-ui-bundle.js' %}"></script>
  <script>
    var swagger_settings = {{ swagger_settings|safe }};
    swagger_settings.dom_id = '#swagger-ui';
    window.onload = function() {
      window.ui = SwaggerUIBundle(swagger_settings);
    }
  </script>
</body>
</html>

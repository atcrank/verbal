version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: verbal_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
  db:
    image: pgvector/pgvector:pg16
    container_name: verbal_db
    environment:
      POSTGRES_USER: verbal_user
      POSTGRES_PASSWORD: verbal_password
      POSTGRES_DB: verbal_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: verbal_grobid
    ports:
      - "8070:8070"
    restart: unless-stopped
    # Grobid can be memory-heavy when processing massive PDFs,
    # but the container handles itself well alongside Ollama.
  ollama:
    image: ollama/ollama
    container_name: verbal_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # Use 'all' to pass all GPUs, or a number for a specific count
              capabilities: [gpu]
  sandbox:
    container_name: verbal_sandbox
    build:
      context: ./sandbox
      args:
        - PIP_INDEX_URL=${PIP_INDEX_URL:-}
        - PIP_TRUSTED_HOST=${PIP_TRUSTED_HOST:-}
    volumes:
      # Map the Django workspaces folder directly into the sandbox
      - ./workspaces:/workspace
    ports:
      - "8002:8000"
    environment:
      # Restricts OpenBLAS (used by numpy/scipy) from pre-allocating massive thread pools 
      # based on the host's physical CPU cores. This prevents it from instantly exhausting
      # its virtual memory space when running inside a heavily restricted container.
      - OPENBLAS_NUM_THREADS=1
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # Physical memory limit. If the script actually *uses* >1G RAM, Docker will OOM kill it.
          memory: 1G
    networks:
      - internal_network

volumes:
  redis_data:
  ollama_data:
  postgres_data:

networks:
  internal_network:
    driver: bridge
version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: verbal_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: verbal_grobid
    ports:
      - "8070:8070"
    restart: unless-stopped
    # Grobid can be memory-heavy when processing massive PDFs,
    # but the container handles itself well alongside Ollama.
  ollama:
    image: ollama/ollama
    container_name: verbal_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # Use 'all' to pass all GPUs, or a number for a specific count
              capabilities: [gpu]

volumes:
  redis_data:
  ollama_data: